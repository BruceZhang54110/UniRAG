spring:
  application:
    name: unirag
  datasource:
    url: jdbc:postgresql://localhost:5432/uni_rag_db
    driver-class-name: org.postgresql.Driver
    username: uni_rag_user
    password: ${PGPASSWORD:StrongPass123!}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql  # 按数据库类型隔离脚本
    baseline-on-migrate: true                     # 存量数据库接入时自动打基线
    baseline-version: 0
    validate-on-migrate: true                     # 强制校验，防止已执行脚本被篡改
    clean-disabled: true                          # 生产环境禁用 clean 操作
    out-of-order: false                           # 禁止乱序执行，保证版本线性
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类别名扫描包
  type-aliases-package: com.unirag.infrastructure.mp.entity
  configuration:
    # 开启驼峰命名自动映射
    map-underscore-to-camel-case: true
    # SQL 日志走 SLF4J（默认 INFO 不输出）。禁止用 StdOutImpl：findAllEnabled 会打印
    # 含密码的 config JSONB 原文到控制台，违反 FR-008。排查 SQL 时按需打开：
    # logging.level.com.unirag.infrastructure.mp.mapper: debug
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
management:
  endpoints:
    web:
      exposure:
        include: health
embedding-store:
  host: localhost
  port: 5432
  database: uni_rag_db
  user: uni_rag_user
  password: ${PGPASSWORD:StrongPass123!}
  table: sdfsdf
  dimension: 1024
unirag:
  ai:
    models:
      default:
        api-key: ${OPENAI_API_KEY:sk-placeholder}
