spring:
  application:
    name: unirag
  servlet:
    multipart:
      # 应用层上限由 unirag.upload.* 控制；此处仅为容器兜底（略大于单文件上限 50MB）
      max-file-size: 60MB
      max-request-size: 70MB
  datasource:
    url: jdbc:postgresql://localhost:5432/uni_rag_db
    driver-class-name: org.postgresql.Driver
    username: uni_rag_user
    password: ${PGPASSWORD:StrongPass123!}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql  # 按数据库类型隔离脚本
    baseline-on-migrate: true                     # 存量数据库接入时自动打基线
    baseline-version: 0
    validate-on-migrate: true                     # 强制校验，防止已执行脚本被篡改
    clean-disabled: true                          # 生产环境禁用 clean 操作
    out-of-order: false                           # 禁止乱序执行，保证版本线性
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类别名扫描包
  type-aliases-package: com.unirag.infrastructure.mp.entity
  configuration:
    # 开启驼峰命名自动映射
    map-underscore-to-camel-case: true
    # SQL 日志走 SLF4J（默认 INFO 不输出）。禁止用 StdOutImpl：findAllEnabled 会打印
    # 含密码的 config JSONB 原文到控制台，违反 FR-008。排查 SQL 时按需打开：
    # logging.level.com.unirag.infrastructure.mp.mapper: debug
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
management:
  endpoints:
    web:
      exposure:
        # SC-004：指标须可被标准监控端点采集（本期只开 health + metrics，不引入 Prometheus 等依赖）
        include: health,metrics
embedding-store:
  host: localhost
  port: 5432
  database: uni_rag_db
  user: uni_rag_user
  password: ${PGPASSWORD:StrongPass123!}
  table: sdfsdf
  dimension: 1024
unirag:
  # 检索默认参数（010）：调用方省略 minScore 时使用。
  retrieval:
    # 校准值 0.70：demo 租户（BAAI/bge-m3）46 次真实检索中，不相关查询最高 0.6958、
    # 相关查询最低 0.7075；分数语义为 (1 + cosine_similarity) / 2，0.70 ≈ 余弦 0.40。
    # 不同嵌入模型分布差异大，可用 UNIRAG_DEFAULT_MIN_SCORE 覆盖（测试环境覆盖为 0.0）。
    default-min-score: ${UNIRAG_DEFAULT_MIN_SCORE:0.70}
    # 重排序（011）：租户配置了 RERANK_MODEL 才真正启用；未配置时行为不变。
    rerank:
      enabled: ${UNIRAG_RERANK_ENABLED:true}       # 全局开关；无租户模型时无效果
      shadow: ${UNIRAG_RERANK_SHADOW:false}        # 观察模式：计算并记录，不改变返回
      recall-top-k: ${UNIRAG_RERANK_RECALL_TOP_K:20} # 内部召回数；实际取 max(topK, 该值)
      # 重排阈值：BGE reranker 的 relevance_score 刻度；0.5 为首期保守起点，可按模型/语料校准。
      min-score: ${UNIRAG_RERANK_MIN_SCORE:0.5}
    # 查询改写（012）：租户配置了 QUERY_REWRITE_MODEL 才启用；资源默认复用主语言模型。
    query-rewrite:
      enabled: ${UNIRAG_QUERY_REWRITE_ENABLED:true}       # 全局开关；无租户资源时无效果
      shadow: ${UNIRAG_QUERY_REWRITE_SHADOW:false}        # 观察模式：计算并记录，不改变检索结果
      max-output-chars: ${UNIRAG_QUERY_REWRITE_MAX_OUTPUT_CHARS:500}
      max-output-ratio: ${UNIRAG_QUERY_REWRITE_MAX_OUTPUT_RATIO:2.0}
      max-input-chars: ${UNIRAG_QUERY_REWRITE_MAX_INPUT_CHARS:2000}
      preview-chars: ${UNIRAG_QUERY_REWRITE_PREVIEW_CHARS:120}
  ai:
    models:
      default:
        api-key: ${OPENAI_API_KEY:sk-placeholder}
  # 原文文件存储；默认值适用于本地开发，生产凭据应由环境变量或密钥管理系统提供。
  storage:
    backend: postgresql            # 存储后端：postgresql、fs 或 s3；默认 postgresql。
    # PostgreSQL 连接串；留空时复用 spring.datasource 的连接参数，避免重复配置凭据。
    connection-string: ""
    table: document_blob           # PostgreSQL 后端的键值表名，Flyway V5 创建。
    key-field: path                # 键列名，须与 document_blob 表结构一致。
    value-field: data              # 内容列名，须与 document_blob 表结构一致。
    root: /                        # OpenDAL 对象键前缀，默认不额外添加前缀。
    fs-root: ./unirag-files        # backend=fs 时的本地存储目录。
  # 上传限制；大小单位为字节，时长使用 Spring Duration 格式。
  upload:
    max-file-size: 52428800        # 单文件最大 50 MiB，适用于一次性及分块上传。
    chunk-size: 5242880            # 固定分块大小 5 MiB，尾块可更小。
    one-shot-threshold: 10485760   # 一次性 multipart 上限 10 MiB；更大文件使用分块上传。
    session-ttl: 24h               # 未完成会话保留 24 小时，之后允许清理。
    janitor-interval: 1h           # 每 1 小时扫描并清理过期会话。
  ingestion:
    async:
      enabled: false
      max-attempts: 3
      backoff-base: 30s
      backoff-max: 15m
      lease: 5m
      poll-interval: 1s
      batch-size: 10
  # 观测与追踪记录（010，FR-006）：全部持久化到 retrieval_observation 表，不依赖外部日志聚合/OTel。
  observability:
    enabled: true                  # 关闭则不注册记录型扩展，主链路行为不变。
    retention: 30d                 # 记录留存时长，超期由清理任务物理删除（Duration 格式）。
    cleanup-interval: 1h           # 清理任务执行间隔。
    max-error-message-length: 500  # 单条错误原因最大留存长度（与 005 ingestion_run 约定一致）。
logging:
  level:
    # 检索链路调试日志（每次查询的目标表、命中片段分数/文档/片段号/摘录、归并与提示词统计）。
    # 生产环境可用 UNIRAG_RETRIEVAL_LOG_LEVEL=info 关闭。
    com.unirag.retrieval.stage: ${UNIRAG_RETRIEVAL_LOG_LEVEL:debug}
    com.unirag.retrieval.pipeline: ${UNIRAG_RETRIEVAL_LOG_LEVEL:debug}
